<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Página não encontrada — By NaNa</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="/assets/img/processed/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Poppins:wght@300;400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css" />
<style>
  .notfound{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;}
  .notfound .brand-mark{font-size:2.2rem;color:var(--ink);margin-bottom:18px;}
  .notfound .eyebrow{margin-bottom:.4em;}
  .notfound h1{font-size:clamp(2.4rem,6vw,4rem);margin-bottom:.2em;}
  .notfound p{max-width:44ch;margin:0 auto 28px;}
  .notfound .btn-row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;}
</style>
</head>
<body>
<div class="notfound">
  <span class="brand-mark">By NaNa</span>
  <p class="eyebrow">Erro 404</p>
  <h1>Essa página saiu de moda.</h1>
  <p>Não encontramos o que você procurava. Ela pode ter sido removida ou o endereço mudou.</p>
  <div class="btn-row">
    <a href="/" class="btn btn-primary">Voltar para a loja</a>
    <a href="/#colecao" class="btn btn-outline">Ver catálogo</a>
  </div>
</div>
</body>
</html>
