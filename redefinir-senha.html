<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Redefinir senha — By NaNa</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="/assets/img/processed/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Poppins:wght@300;400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css?v=20260825" />
</head>
<body>
<a class="skip-link" href="#main-content">Pular para o conteúdo</a>
<main class="reset-wrap" id="main-content">
  <div class="reset-card">
    <span class="brand-mark">By NaNa</span>
    <h1>Redefinir senha</h1>
    <p class="account-sub">Defina uma nova senha para sua conta.</p>
    <form class="account-form" id="resetForm">
      <label>Nova senha<input type="password" id="resetPassword" required minlength="8" autocomplete="new-password" /></label>
      <label>Confirmar senha<input type="password" id="resetPasswordConfirm" required minlength="8" autocomplete="new-password" /></label>
      <p class="account-form-msg" id="resetMsg" hidden></p>
      <button type="submit" class="btn btn-primary btn-block">Salvar nova senha</button>
    </form>
    <p class="account-sub reset-back"><a href="/">Voltar para a loja</a></p>
  </div>
</main>
<script src="/assets/js/redefinir-senha.js?v=20260825"></script>
</body>
</html>
