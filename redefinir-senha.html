<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Redefinir senha — By NaNa</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="/assets/img/processed/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Poppins:wght@300;400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css" />
<style>
  .reset-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;}
  .reset-card{width:100%;max-width:380px;text-align:left;}
  .reset-card .brand-mark{display:block;text-align:center;font-size:2rem;color:var(--ink);margin-bottom:22px;}
  .reset-card h1{font-size:1.4rem;margin-bottom:.3em;}
</style>
</head>
<body>
<div class="reset-wrap">
  <div class="reset-card">
    <span class="brand-mark">By NaNa</span>
    <h1>Redefinir senha</h1>
    <p class="account-sub">Defina uma nova senha para sua conta.</p>
    <form class="account-form" id="resetForm">
      <label>Nova senha<input type="password" id="resetPassword" required minlength="6" autocomplete="new-password" /></label>
      <label>Confirmar senha<input type="password" id="resetPasswordConfirm" required minlength="6" autocomplete="new-password" /></label>
      <p class="account-form-msg" id="resetMsg" hidden></p>
      <button type="submit" class="btn btn-primary btn-block">Salvar nova senha</button>
    </form>
    <p class="account-sub" style="margin-top:18px;"><a href="/">Voltar para a loja</a></p>
  </div>
</div>
<script>
  const form = document.getElementById('resetForm');
  const msg = document.getElementById('resetMsg');
  const token = new URLSearchParams(location.search).get('token') || '';

  function setMsg(text, kind) {
    msg.textContent = text;
    msg.className = `account-form-msg ${kind === 'ok' ? 'is-ok' : 'is-error'}`;
    msg.hidden = !text;
  }

  if (!token) {
    form.hidden = true;
    setMsg('Link inválido. Solicite a redefinição de senha novamente na loja.', 'error');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    setMsg('', '');
    const newPassword = document.getElementById('resetPassword').value;
    const confirm = document.getElementById('resetPasswordConfirm').value;
    if (newPassword !== confirm) {
      setMsg('As senhas não coincidem.', 'error');
      return;
    }
    try {
      const res = await fetch('/api/customers/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, newPassword }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Não foi possível redefinir a senha');
      form.hidden = true;
      setMsg('Senha redefinida! Você já pode entrar na loja com a nova senha.', 'ok');
    } catch (err) {
      setMsg(err.message, 'error');
    }
  });
</script>
</body>
</html>
