name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bynana
          POSTGRES_PASSWORD: bynana
          POSTGRES_DB: bynana_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bynana -d bynana_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://bynana:bynana@127.0.0.1:5432/bynana_test
      SESSION_SECRET: ci-customer-session-secret-at-least-32-characters
      ADMIN_SESSION_SECRET: ci-admin-session-secret-at-least-32-characters
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node db/migrate.js
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ci
