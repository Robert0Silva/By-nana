services:
  - type: web
    name: by-nana
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    # Aplica ALTERs idempotentes antes de subir uma versão que dependa do novo esquema.
    startCommand: node db/migrate.js && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      # Neon (pooler) — mesma URL que já está no .env local.
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: ADMIN_SESSION_SECRET
        sync: false
      # Usados só uma vez por `node db/seed-admin.js` para criar o primeiro admin (owner).
      - key: SEED_ADMIN_NAME
        sync: false
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
      # E-mail transacional (Resend).
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Domínio final do site — usado no sitemap, robots.txt, og:image e no link do
      # e-mail de carrinho abandonado. Preencher com a URL pública real (ex.: https://bynana.com.br).
      - key: SITE_URL
        sync: false
      # WhatsApp de atendimento com DDI + DDD, somente números (ex.: 5531999999999).
      - key: WHATSAPP_NUMBER
        value: "5531973053380"
      # Opcionais — deixar em branco por enquanto vira no-op automático no analytics.js.
      - key: GA4_MEASUREMENT_ID
        sync: false
      - key: META_PIXEL_ID
        sync: false
      # Opcional — sem isso, checkout continua 100% manual via WhatsApp (comportamento atual).
      - key: PAYMENT_PROVIDER
        sync: false
      # Só usados quando PAYMENT_PROVIDER=pagseguro (ver .env.example).
      - key: PAGSEGURO_TOKEN
        sync: false
      - key: PAGSEGURO_SANDBOX
        sync: false
